server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /             { try_files /index.html =404; }
    location = /favicon.ico  { try_files $uri =404; }
    location /assets/        { try_files $uri =404; }
    location /stats/         { try_files $uri /index.html =404; } # SPA deep link

    # Everything else (/session, /links, /health, /swagger, and slug
    # redirects) proxies to the API — proxy_pass with no path preserves the
    # original URI regardless of which prefix matched, so one catch-all
    # covers all of them; no need for a block per route.
    location /        { proxy_pass http://127.0.0.1:8080; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
